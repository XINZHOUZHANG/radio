name: RadioLite

options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 5.9
    CURRENT_PROJECT_VERSION: 14
    MARKETING_VERSION: 0.2.5
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  RadioLite:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: Features
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Radio Lite
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSMicrophoneUsageDescription: Radio Lite uses the microphone only while you hold voice PTT.
        NSLocalNetworkUsageDescription: Radio Lite connects to your remote-radio server on the local network or Tailscale.
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.992218.radio-lite.remote
        GENERATE_INFOPLIST_FILE: false
    scheme:
      testTargets:
        - RadioLiteTests

  RadioLiteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../RadioLiteTests
    dependencies:
      - target: RadioLite
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.992218.radio-lite.remote.tests
        GENERATE_INFOPLIST_FILE: true
