name: TX5DRMobile

options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 5.9
    CURRENT_PROJECT_VERSION: 14
    MARKETING_VERSION: 0.3.0
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  TX5DRMobile:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: Features
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: TX-5DR Remote
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSMicrophoneUsageDescription: "语音 PTT 发射和录制语音键控素材时，TX-5DR Remote 需要使用麦克风。"
        NSLocalNetworkUsageDescription: "TX-5DR Remote 需要通过局域网或 Tailscale 连接 TX-5DR 服务器。"
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.992218.tx5dr.remote
        GENERATE_INFOPLIST_FILE: false
    scheme:
      testTargets:
        - TX5DRMobileTests

  TX5DRMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../TX5DRMobileTests
    dependencies:
      - target: TX5DRMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.992218.tx5dr.remote.tests
        GENERATE_INFOPLIST_FILE: true
