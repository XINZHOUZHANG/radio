name: TX5DRMobile

options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 5.9
    CURRENT_PROJECT_VERSION: 3
    MARKETING_VERSION: 0.1.2
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  TX5DRMobile:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: Features
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: TX-5DR Remote
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSMicrophoneUsageDescription: TX-5DR Remote uses the microphone for held voice PTT and voice-keyer recordings.
        NSLocalNetworkUsageDescription: TX-5DR Remote connects to your radio server on the local network.
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.992218.tx5dr.remote
        GENERATE_INFOPLIST_FILE: false
    scheme:
      testTargets:
        - TX5DRMobileTests

  TX5DRMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../TX5DRMobileTests
    dependencies:
      - target: TX5DRMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.992218.tx5dr.remote.tests
        GENERATE_INFOPLIST_FILE: true
