name: iOS native client

on:
  push:
    branches:
      - main
      - codex/**
    paths:
      - ios/**
      - docs/tx5dr/**
      - scripts/check-ios-tx5dr-contract.mjs
      - scripts/check-ios-radio-lite-contract.mjs
      - scripts/tests/**
      - .github/workflows/ios.yml
  pull_request:
    paths:
      - ios/**
      - docs/tx5dr/**
      - scripts/check-ios-tx5dr-contract.mjs
      - scripts/check-ios-radio-lite-contract.mjs
      - scripts/tests/**
      - .github/workflows/ios.yml
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/tests/*.test.mjs
      - run: node scripts/check-ios-tx5dr-contract.mjs
      - run: node scripts/check-ios-radio-lite-contract.mjs

  xcode-build-and-test:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec ios/TX5DRMobile/project.yml
      - name: Select an available iPhone simulator
        shell: bash
        run: |
          xcrun simctl list devices available -j | python3 -c '
          import json, sys
          payload = json.load(sys.stdin)
          devices = [
              device
              for runtime, values in payload["devices"].items()
              if "iOS" in runtime
              for device in values
              if device.get("isAvailable") and "iPhone" in device.get("name", "")
          ]
          if not devices:
              raise SystemExit("No available iPhone simulator is installed")
          print("SIMULATOR_UDID=" + devices[0]["udid"])
          ' >> "$GITHUB_ENV"
      - name: Build and run XCTest
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios/TX5DRMobile/TX5DRMobile.xcodeproj \
            -scheme TX5DRMobile \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,id=${SIMULATOR_UDID}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee xcodebuild.log
      - name: Publish Swift compiler diagnostics
        if: failure()
        run: python3 scripts/annotate-xcodebuild.py xcodebuild.log

  unsigned-device-ipa:
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec ios/TX5DRMobile/project.yml
      - name: Build unsigned iPhone application
        shell: bash
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/TX5DRMobile/TX5DRMobile.xcodeproj \
            -scheme TX5DRMobile \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/TX5DRMobileDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' \
            2>&1 | tee xcodebuild-device.log
      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/TX5DRMobileDerivedData/Build/Products/Debug-iphoneos/TX5DRMobile.app"
          PACKAGE_ROOT="$RUNNER_TEMP/TX5DRMobileUnsigned"
          test -d "$APP_PATH"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")" = "0.2.2"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")" = "8"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity:NSAllowsArbitraryLoads' "$APP_PATH/Info.plist")" = "true"
          if /usr/libexec/PlistBuddy -c 'Print :NSAppTransportSecurity:NSAllowsLocalNetworking' "$APP_PATH/Info.plist" >/dev/null 2>&1; then
            echo "::error::NSAllowsLocalNetworking makes iOS ignore NSAllowsArbitraryLoads"
            exit 1
          fi
          mkdir -p "$PACKAGE_ROOT/Payload"
          ditto "$APP_PATH" "$PACKAGE_ROOT/Payload/TX5DRMobile.app"
          (
            cd "$PACKAGE_ROOT"
            /usr/bin/zip -qry "$GITHUB_WORKSPACE/Radio-Lite-Debug-unsigned.ipa" Payload
          )
          shasum -a 256 "$GITHUB_WORKSPACE/Radio-Lite-Debug-unsigned.ipa" \
            > "$GITHUB_WORKSPACE/Radio-Lite-Debug-unsigned.ipa.sha256"
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Radio-Lite-Debug-unsigned-${{ github.sha }}
          path: |
            Radio-Lite-Debug-unsigned.ipa
            Radio-Lite-Debug-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Publish Swift compiler diagnostics
        if: failure() && hashFiles('xcodebuild-device.log') != ''
        run: python3 scripts/annotate-xcodebuild.py xcodebuild-device.log
