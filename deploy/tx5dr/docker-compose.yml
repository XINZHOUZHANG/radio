name: ${COMPOSE_PROJECT_NAME:-testradio}

services:
  tx5dr:
    build:
      context: ./upstream
      dockerfile: Dockerfile
      args:
        VCS_REF: ${TX5DR_UPSTREAM_COMMIT:-f9e07fec6c5fb67b5c904936b5df03c1e3b0f5dc}
    image: ${TX5DR_IMAGE:-testradio/tx5dr:f9e07fe}
    container_name: testradio-tx5dr
    restart: unless-stopped
    stop_grace_period: 45s
    ports:
      - "0.0.0.0:${TX5DR_HTTP_PORT:-8076}:80/tcp"
      - "0.0.0.0:${TX5DR_HTTPS_PORT:-8443}:443/tcp"
      - "0.0.0.0:${TX5DR_REALTIME_UDP_PORT:-50110}:50110/udp"
      - "0.0.0.0:${TX5DR_RIGCTLD_BRIDGE_PORT:-4532}:4532/tcp"
    volumes:
      - ./data:/app/data
      - ./data/logs/nginx:/var/log/nginx
      - ./data/logs/supervisor:/var/log/supervisor
      - ./configure-dummy.mjs:/opt/testradio-bootstrap/configure-dummy.mjs:ro
    environment:
      NODE_ENV: production
      PORT: "4000"
      TX5DR_CONFIG_DIR: /app/data/config
      TX5DR_DATA_DIR: /app/data
      TX5DR_LOGS_DIR: /app/data/logs
      TX5DR_CACHE_DIR: /app/data/cache
      RTC_DATA_AUDIO_UDP_PORT: "50110"
      RTC_DATA_AUDIO_ICE_UDP_MUX: "1"
      PULSE_SERVER: tcp:dummy-audio:4713
      PULSE_LATENCY_MSEC: "60"
      TX5DR_RTAUDIO_API: pulse
      TX5DR_DUMMY_CALLSIGN: ${TX5DR_DUMMY_CALLSIGN:-N0CALL}
      TX5DR_DUMMY_GRID: ${TX5DR_DUMMY_GRID:-AA00}
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - SYS_NICE
      - SYS_RESOURCE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=100m
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4000/api/hello').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 12
    depends_on:
      dummy-rig:
        condition: service_started
      dummy-audio:
        condition: service_healthy

  dummy-rig:
    build:
      context: ./dummy-rig
    image: testradio/hamlib-dummy:4-bookworm
    container_name: testradio-dummy-rig
    restart: unless-stopped
    expose:
      - "4532/tcp"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m

  dummy-audio:
    build:
      context: ./dummy-audio
    image: testradio/pulseaudio-dummy:bookworm
    container_name: testradio-dummy-audio
    restart: unless-stopped
    expose:
      - "4713/tcp"
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /run:rw,nosuid,nodev,size=8m
      - /tmp:rw,noexec,nosuid,size=8m
      - /var/lib/pulse:rw,nosuid,nodev,size=8m
